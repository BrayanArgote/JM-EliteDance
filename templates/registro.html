<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css')}}">
</head>
<body>

    <section> 
        <nav>
            <a href="{{ url_for('inicio_sesion') }}" class="btn"><ion-icon name="caret-back-outline"></ion-icon></a>
        </nav>
            <div class="login-box">
            <form action="">
                <h2>Registro</h2>
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-circle"></ion-icon></span>
                    <input type="input" required placeholder=" ">
                    <label>Nombre completo </label>
                </div>

                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" required placeholder=" ">
                    <label>Correo electronico</label>
                </div>
                
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" required placeholder=" ">
                    <label>Contraseña</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox">Recordarme</label>
                </div>
                <button type="submit">Registro</button>
                <div class="register-link">
                    <p>¿Ya tienes cuenta? <a href="{{ url_for('inicio_sesion') }}">iniciar sesión</a></p>
                </div>
            </form>
        </div>
    </section>

   



    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
        
</body>

</html>
