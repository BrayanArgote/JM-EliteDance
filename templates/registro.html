{% extends "base.html" %}

{% block title %}Inicio{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio_sesion-registro.css') }}">
{% endblock %}

{% block nav_links %}
    <li><a href="{{ url_for('inicio_sesion') }}">Iniciar sesión</a></li>
    <li><button class="nav-btn">Comienza a bailar</button></li>
{% endblock %}

{% block content %}
    <section> 
            <div class="formulario">
            <form action="">
                <h2>Registro</h2>
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-circle"></ion-icon></span>
                    <input type="input" required placeholder=" ">
                    <label>Nombre completo </label>
                </div>

                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" required placeholder=" ">
                    <label>Correo electronico</label>
                </div>
                
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" required placeholder=" ">
                    <label>Contraseña</label>
                </div>
                <button type="submit" class="btn-iniciar-sesion-registro">Registro</button>
                <div class="enlace-iniciar-sesion-registro">
                    <p>¿Ya tienes cuenta? <a href="{{ url_for('inicio_sesion') }}">iniciar sesión</a></p>
                </div>
            </form>
        </div>
    </section>
{% endblock %}

{% block extra_js %}
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
{% endblock %}
